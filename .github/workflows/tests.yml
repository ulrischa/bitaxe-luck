name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.9.0 ruff==0.16.7
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - run: python tests/ha_smoke.py
